name: Update GitHub activity

on:
  schedule:
    - cron: '18 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub activity data
        env:
          GH_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN || github.token }}
        run: node scripts/update-github-activity.js

      - name: Commit updated activity data
        run: |
          if git diff --quiet -- github-activity-data.js; then
            echo "No activity data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity-data.js
          git commit -m "Update GitHub activity data"
          git push
